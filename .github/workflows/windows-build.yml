name: Build EzEizo Windows 2.5.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'INSTALL-WINDOWS.md'
      - 'launch/NativeLauncher.cpp'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile manager native UI
        run: dotnet build src/EzEizo.Native.Metis/EzEizo.Native.Metis.csproj -c Release
      - name: Compile mechanic native UI
        run: dotnet build src/EzEizo.Native.Mechanic/EzEizo.Native.Mechanic.csproj -c Release
      - name: Publish native apps
        shell: pwsh
        run: |
          dotnet publish src/EzEizo.Native.Metis/EzEizo.Native.Metis.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -o dist/manager
          dotnet publish src/EzEizo.Native.Mechanic/EzEizo.Native.Mechanic.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -o dist/mechanic
          New-Item -ItemType Directory -Force dist/EzEizo/program | Out-Null
          Copy-Item dist/manager/* dist/EzEizo/program/ -Recurse -Force
          $mechanicRoot = (Resolve-Path dist/mechanic).Path
          Get-ChildItem $mechanicRoot -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($mechanicRoot.Length).TrimStart([IO.Path]::DirectorySeparatorChar)
            $destination = Join-Path (Resolve-Path dist/EzEizo/program).Path $relative
            if (Test-Path $destination) {
              if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash $destination).Hash) { throw "Shared runtime differs: $relative" }
            } else {
              New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
              Copy-Item $_.FullName $destination
            }
          }
          if (Test-Path dist/EzEizo/program/Microsoft.Web.WebView2.Core.dll) { throw 'Native build unexpectedly contains WebView2' }
      - name: Build two direct EXE launchers
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ build tools not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $output = (Resolve-Path dist/EzEizo).Path + '\Metis.exe'
          $line = 'call "' + $devcmd + '" -arch=x64 >nul && cl.exe /nologo /O2 /MT /EHsc /DUNICODE /D_UNICODE /Fe:"' + $output + '" launch\NativeLauncher.cpp /link /SUBSYSTEM:WINDOWS /OUT:"' + $output + '"'
          cmd /c $line
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $output)) { throw 'Native launcher compilation failed' }
          Copy-Item $output dist/EzEizo/Mechanic.exe
      - name: Install Access engine for offline tests
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $download
          $process = Start-Process -FilePath $download -ArgumentList '/quiet' -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "Access Engine installation failed: $($process.ExitCode)" }
      - name: Test native offline database workflow
        shell: pwsh
        run: |
          $manager = (Resolve-Path dist/EzEizo/program/EzEizo-Native-Metis.exe).Path
          $result = Start-Process -FilePath $manager -ArgumentList '--self-test' -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            if (Test-Path dist/EzEizo/program/native-test-error.txt) { Get-Content dist/EzEizo/program/native-test-error.txt }
            throw 'Offline manager and mechanic workflow failed'
          }
      - name: Test native PDF and ZIP export
        shell: pwsh
        run: |
          $manager = (Resolve-Path dist/EzEizo/program/EzEizo-Native-Metis.exe).Path
          $result = Start-Process -FilePath $manager -ArgumentList '--verify-pdf' -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            if (Test-Path dist/EzEizo/program/native-test-error.txt) { Get-Content dist/EzEizo/program/native-test-error.txt }
            throw 'PDF or ZIP export failed'
          }
      - name: Test simultaneous Access startup
        shell: pwsh
        run: |
          $manager = (Resolve-Path dist/EzEizo/program/EzEizo-Native-Metis.exe).Path
          $mechanic = (Resolve-Path dist/EzEizo/program/EzEizo-Native-Mechanic.exe).Path
          $jobs = @((Start-Process $manager -ArgumentList '--probe-startup' -PassThru), (Start-Process $mechanic -ArgumentList '--probe-startup' -PassThru))
          foreach ($process in $jobs) {
            if (!$process.WaitForExit(60000) -or $process.ExitCode -ne 0) {
              if (Test-Path dist/EzEizo/program/native-test-error.txt) { Get-Content dist/EzEizo/program/native-test-error.txt }
              throw 'Simultaneous Access startup failed'
            }
          }
      - name: Package a clean Access template and launchers
        shell: pwsh
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          $db = Join-Path $desktop 'EzEizo/data/EzEizo.accdb'
          Remove-Item $db -Force
          $initial = Join-Path $desktop 'EzEizo/data/initial-manager.txt'
          if (Test-Path $initial) { Remove-Item $initial -Force }
          $manager = (Resolve-Path dist/EzEizo/program/EzEizo-Native-Metis.exe).Path
          $result = Start-Process -FilePath $manager -ArgumentList '--seed-template' -Wait -PassThru
          if ($result.ExitCode -ne 0 -or !(Test-Path $db)) { throw 'Clean ACCDB template creation failed' }
          New-Item -ItemType Directory -Force dist/EzEizo/data | Out-Null
          Copy-Item $db dist/EzEizo/data/EzEizo.accdb
          if (Test-Path dist/EzEizo/program/wwwroot) { throw 'Native package contains the old website' }
      - name: Launch both native windows
        shell: pwsh
        run: |
          $manager = (Resolve-Path dist/EzEizo/program/EzEizo-Native-Metis.exe).Path
          $mechanic = (Resolve-Path dist/EzEizo/program/EzEizo-Native-Mechanic.exe).Path
          $processes = @((Start-Process $manager -PassThru), (Start-Process $mechanic -PassThru))
          Start-Sleep -Seconds 10
          foreach ($process in $processes) {
            if ($process.HasExited) { throw "Native window exited unexpectedly: $($process.ExitCode)" }
            $process.Kill()
          }
      - name: Verify direct launchers open both applications
        shell: pwsh
        run: |
          Start-Process (Resolve-Path dist/EzEizo/Metis.exe).Path
          Start-Process (Resolve-Path dist/EzEizo/Mechanic.exe).Path
          Start-Sleep -Seconds 4
          $manager = Get-Process 'EzEizo-Native-Metis' -ErrorAction SilentlyContinue
          $mechanic = Get-Process 'EzEizo-Native-Mechanic' -ErrorAction SilentlyContinue
          if (!$manager -or !$mechanic) { throw 'Direct EXE launch failed' }
          $manager | Stop-Process -Force
          $mechanic | Stop-Process -Force
      - name: Smoke test native manager login and navigation
        shell: pwsh
        run: |
          $manager = (Resolve-Path dist/EzEizo/program/EzEizo-Native-Metis.exe).Path
          $result = Start-Process -FilePath $manager -ArgumentList '--ui-smoke' -PassThru
          if (!$result.WaitForExit(60000) -or $result.ExitCode -ne 0) {
            if (Test-Path dist/EzEizo/program/native-test-error.txt) { Get-Content dist/EzEizo/program/native-test-error.txt }
            throw 'Native manager login or navigation failed'
          }
      - name: Smoke test technician login and task queue
        shell: pwsh
        run: |
          $mechanic = (Resolve-Path dist/EzEizo/program/EzEizo-Native-Mechanic.exe).Path
          $result = Start-Process -FilePath $mechanic -ArgumentList '--ui-smoke-tech' -PassThru
          if (!$result.WaitForExit(60000) -or $result.ExitCode -ne 0) {
            if (Test-Path dist/EzEizo/program/native-test-error.txt) { Get-Content dist/EzEizo/program/native-test-error.txt }
            throw 'Native technician login or queue failed'
          }
      - name: Save UI screenshot outside the distributable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/screenshots | Out-Null
          $screens = Get-ChildItem dist/EzEizo/program/native-*.png
          if ($screens.Count -lt 8) { throw 'Missing native UI screenshots' }
          Copy-Item $screens.FullName dist/screenshots/
          Remove-Item $screens.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: EzEizo-native-ui-screenshot
          path: dist/screenshots
          retention-days: 7
      - name: Include install guide and verify package
        shell: pwsh
        run: |
          Copy-Item INSTALL-WINDOWS.md dist/EzEizo/README.txt
          if (!(Test-Path dist/EzEizo/Metis.exe) -or !(Test-Path dist/EzEizo/Mechanic.exe) -or !(Test-Path dist/EzEizo/data/EzEizo.accdb) -or !(Test-Path dist/EzEizo/program/EzEizo-Native-Metis.exe) -or !(Test-Path dist/EzEizo/program/EzEizo-Native-Mechanic.exe)) { throw 'Incomplete release package' }
          $bytes = (Get-ChildItem dist/EzEizo -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Package size: {0:N1} MiB" -f ($bytes / 1MB))
      - uses: actions/upload-artifact@v4
        with:
          name: EzEizo-Windows-2.5.1-files
          path: dist/EzEizo
          retention-days: 30
      - name: Publish versioned Windows ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/EzEizo -DestinationPath dist/EzEizo-Windows-2.5.1.zip -Force
          $tag = 'v2.5.1'
          $notes = 'Native Windows manager and technician applications using local Access without WebView2 or Internet. Extract EzEizo to Desktop. Preserve the existing data folder when updating. See README.txt.'
          gh release create $tag dist/EzEizo-Windows-2.5.1.zip --target $env:GITHUB_SHA --title 'EzEizo Windows 2.5.1' --notes $notes
