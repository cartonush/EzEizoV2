name: Build Windows prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wwwroot/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish manager
        shell: pwsh
        run: dotnet publish src/EzEizo.Metis/EzEizo.Metis.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/Metis
      - name: Publish mechanic
        shell: pwsh
        run: dotnet publish src/EzEizo.Mechanic/EzEizo.Mechanic.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/Mechanic
      - name: Prepare desktop folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/EzEizo | Out-Null
          Copy-Item wwwroot dist/EzEizo/wwwroot -Recurse
          Copy-Item dist/Metis/EzEizo-Metis.exe dist/EzEizo/
          Copy-Item dist/Mechanic/EzEizo-Mechanic.exe dist/EzEizo/
          Copy-Item INSTALL-WINDOWS.md dist/EzEizo/README.txt
      - name: Install Access Engine on disposable build runner
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'accessdatabaseengine_X64.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe' -OutFile $download
          $process = Start-Process -FilePath $download -ArgumentList '/quiet' -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "Access Engine installation failed: $($process.ExitCode)" }
      - name: Try creating an Access database on Windows
        shell: pwsh
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          $exe = (Resolve-Path 'dist/EzEizo/EzEizo-Metis.exe').Path
          $result = Start-Process -FilePath $exe -ArgumentList '--create-database' -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            if (Test-Path dist/EzEizo/database-error.txt) { Get-Content dist/EzEizo/database-error.txt }
            throw "Database generation failed: $($result.ExitCode)"
          }
          $generated = Join-Path $desktop 'EzEizo/data/EzEizo.accdb'
          if (!(Test-Path $generated)) { throw 'No ACCDB generated' }
          Write-Host 'Created real EzEizo.accdb with all tables'
      - name: Smoke test local manager and mechanic workflow
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/EzEizo/EzEizo-Metis.exe').Path
          $result = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            if (Test-Path dist/EzEizo/database-error.txt) { Get-Content dist/EzEizo/database-error.txt }
            throw "Smoke test failed: $($result.ExitCode)"
          }
          Write-Host 'Login, assignment, submission and review passed'
      - name: Check output
        shell: pwsh
        run: |
          Get-ChildItem dist/EzEizo -Recurse | Select-Object FullName,Length
          if (!(Test-Path dist/EzEizo/EzEizo-Metis.exe) -or !(Test-Path dist/EzEizo/EzEizo-Mechanic.exe) -or !(Test-Path dist/EzEizo/wwwroot/index.html)) { throw 'Missing executable or UI assets' }
      - uses: actions/upload-artifact@v4
        with:
          name: EzEizo-Windows-x64
          path: dist/EzEizo
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable Windows ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/EzEizo -DestinationPath dist/EzEizo-Windows-x64.zip -Force
          $tag = 'v2.0.0-preview.2'
          gh release create $tag dist/EzEizo-Windows-x64.zip --target $env:GITHUB_SHA --title 'EzEizo Windows 2.0.0 Preview 2' --notes 'Offline Windows update with website styling. Preserve your existing data/EzEizo.accdb. Login only; first manager remains primary. See README.txt.' --prerelease
